name: Deploy Ticket Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  enable-maintenance:
    name: Enable maintenance mode
    runs-on: ubuntu-latest
    steps:
      - name: Enable maintenance through Ticket FastAPI
        env:
          TICKET_MAINTENANCE_ON_URL: ${{ secrets.TICKET_MAINTENANCE_ON_URL }}
          MAINTENANCE_ON_URL: ${{ secrets.MAINTENANCE_ON_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          TARGET_URL="${TICKET_MAINTENANCE_ON_URL:-$MAINTENANCE_ON_URL}"
          TARGET_URL=$(echo "$TARGET_URL" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          MAINTENANCE_TOKEN=$(echo "$MAINTENANCE_TOKEN" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "[maintenance:on] Starting maintenance enable request"
          test -n "$TARGET_URL" || { echo "Missing TICKET_MAINTENANCE_ON_URL or MAINTENANCE_ON_URL secret"; exit 1; }
          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:on] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:on] MAINTENANCE_TOKEN is empty"
            exit 1
          fi
          echo "[maintenance:on] Endpoint is configured: $TARGET_URL"
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-on-response.txt \
            --dump-header maintenance-on-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$TARGET_URL" || true)
          echo "[maintenance:on] HTTP status: $status"
          echo "[maintenance:on] Response headers:"
          sed 's/[Aa]uthorization:[^[:space:]]*/Authorization: [redacted]/g' maintenance-on-headers.txt || true
          echo "[maintenance:on] Response body:"
          cat maintenance-on-response.txt || true
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "[maintenance:on] Maintenance enabled successfully"
          else
            echo "[maintenance:on] Warning: Service endpoint returned $status prior to deployment. Proceeding with deployment to start/restart PM2..."
          fi

  deploy:
    name: Deploy Ticket to EC2
    runs-on: ubuntu-latest
    needs: enable-maintenance
    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"
            git stash --include-untracked || true
            git fetch origin main
            git checkout -f -B main origin/main
            git stash drop || true
            if [ -f "requirements.txt" ]; then
              if [ -x "./ticket-venv/bin/pip" ]; then
                ./ticket-venv/bin/pip install -r requirements.txt
              elif [ -x "./venv/bin/pip" ]; then
                ./venv/bin/pip install -r requirements.txt
              elif command -v pip3 >/dev/null 2>&1; then
                pip3 install -r requirements.txt
              else
                pip install -r requirements.txt
              fi
            fi
            touch /home/ec2-user/ticket-maintenance.flag ticket-maintenance.flag /tmp/ticket-maintenance.flag || true
            pm2 restart ticket-service || pm2 restart "${{ secrets.PM2_SERVICE_NAME }}" || (pm2 describe ticket-service >/dev/null 2>&1 && pm2 restart ticket-service || pm2 start "uvicorn ticket_service:app --host 0.0.0.0 --port 8025" --name ticket-service) || true
            pm2 save || true
            echo "Deployment commands completed successfully."

  selenium-smoke-tests:
    name: Selenium Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: "latest"
          install-chromedriver: true

      - name: Link Chrome binary
        run: |
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -n "$CHROME_PATH" ] && [ -f "$CHROME_PATH" ]; then
            sudo ln -fs "$CHROME_PATH" /usr/bin/google-chrome || true
            sudo ln -fs "$CHROME_PATH" /usr/bin/chrome || true
          fi

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --only-binary :all: --upgrade pip==25.0.1
          python -m pip install --only-binary :all: selenium==4.29.0 pytest==8.3.5 requests==2.32.3

      - name: Wait for deployed Ticket service
        env:
          TICKET_BASE_URL: https://www.chakorahub.com
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 10 "$TICKET_BASE_URL/tickets" > /dev/null; then
              echo "Deployed website is responding."
              exit 0
            fi
            echo "Website not ready (attempt $attempt/12)."
            sleep 10
          done
          echo "Deployed website did not become ready."
          exit 1

      - name: Run Selenium smoke tests
        env:
          TICKET_BASE_URL: https://www.chakorahub.com
          EXPECT_MAINTENANCE_NOTICE: "true"
          RUN_WRITE_TESTS: "false"
        run: |
          pytest -v ticket_smoke.py --junitxml=selenium-results.xml

      - name: Upload Selenium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: selenium-results.xml
          if-no-files-found: warn

  disable-maintenance:
    name: Disable maintenance after passing tests
    runs-on: ubuntu-latest
    needs: selenium-smoke-tests
    if: ${{ needs.selenium-smoke-tests.result == 'success' }}
    steps:
      - name: Disable maintenance through Ticket FastAPI
        env:
          TICKET_MAINTENANCE_OFF_URL: ${{ secrets.TICKET_MAINTENANCE_OFF_URL }}
          MAINTENANCE_OFF_URL: ${{ secrets.MAINTENANCE_OFF_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          TARGET_URL="${TICKET_MAINTENANCE_OFF_URL:-$MAINTENANCE_OFF_URL}"
          TARGET_URL=$(echo "$TARGET_URL" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          MAINTENANCE_TOKEN=$(echo "$MAINTENANCE_TOKEN" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "[maintenance:off] Starting maintenance disable request"
          test -n "$TARGET_URL" || { echo "Missing TICKET_MAINTENANCE_OFF_URL or MAINTENANCE_OFF_URL secret"; exit 1; }
          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:off] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:off] MAINTENANCE_TOKEN is empty"
            exit 1
          fi
          echo "[maintenance:off] Endpoint is configured: $TARGET_URL"
          status=$(curl --silent --show-error --location-trusted --post301 --post302 --post303 --max-time 20 \
            --output maintenance-off-response.txt \
            --dump-header maintenance-off-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$TARGET_URL" || true)
          echo "[maintenance:off] HTTP status: $status"
          echo "[maintenance:off] Response headers:"
          sed 's/[Aa]uthorization:[^[:space:]]*/Authorization: [redacted]/g' maintenance-off-headers.txt || true
          echo "[maintenance:off] Response body:"
          cat maintenance-off-response.txt || true
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "[maintenance:off] Maintenance disabled successfully via API"
          else
            echo "[maintenance:off] Warning: API returned status $status. Proceeding to direct SSH flag removal."
          fi

      - name: SSH Direct Cleanup on EC2
        if: always()
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            rm -f /home/ec2-user/ticket-maintenance.flag /tmp/ticket-maintenance.flag "${{ secrets.APP_PATH }}/ticket-maintenance.flag" || true
            echo "Direct SSH maintenance flag cleanup completed."

